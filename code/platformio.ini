; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[common]
; one exact version, the screenshot tests render with the same u8g2 as the device
u8g2 = olikraus/U8g2@2.36.18

[env]
test_framework = unity
test_build_src = true

[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash    = 80000000L
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_filter = embedded/*
lib_deps = 
	mathertel/RotaryEncoder@^1.5.3
	${common.u8g2}
	hieromon/AutoConnect@^1.4.1
	https://github.com/ricmoo/QRCode.git
build_flags = 
	; -DDEV_DISPLAY
	-DCORE_DEBUG_LEVEL=3
extra_scripts =
	pre:scripts/firmware_version.py
	pre:scripts/lang_from_env.py
	; adds `pio run -t serve`, see scripts/serve_firmware.py
	scripts/serve_target.py

[env:native]
platform = native
build_type = debug
build_flags = 
	-DNATIVE -O0
lib_deps =
	${common.u8g2}
	https://github.com/ricmoo/QRCode.git
; QRCode is an Arduino library, but plain C, so it builds natively too, and
; U8g2 keeps everything Arduino-specific behind #ifdef ARDUINO
lib_compat_mode = off
debug_test = native/test_auto_tare
test_filter = native/*

; The firmware in a window on your computer, see the README. Needs SDL2
; (libsdl2-dev on Debian/Ubuntu). Run with: pio run -e emulator -t exec
[env:emulator]
platform = native
build_flags =
	-DNATIVE -DEMULATOR
	!sdl2-config --cflags --libs
lib_deps =
	${common.u8g2}
	https://github.com/ricmoo/QRCode.git
lib_compat_mode = off
extra_scripts =
	pre:scripts/lang_from_env.py
